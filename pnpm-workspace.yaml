# pnpm 12 reads its settings from here rather than package.json or .npmrc.

packages:
  - mobile
  - web
  - packages/*

# A flat, npm-style node_modules.
nodeLinker: hoisted

# Build scripts are opt-in; unlisted packages fail the install.
allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  detox: true
  esbuild: true
  unrs-resolver: true
  dtrace-provider: false

# pnpm 12 refuses packages published less than a day ago as a supply-chain
# guard. Expo ships coordinated patch releases across all of its packages, so
# `expo install` regularly resolves to versions from the same day. Exempt them.
minimumReleaseAgeExclude:
  - expo
  - 'expo-*'
  - '@expo/*'
  - babel-preset-expo
  - jest-expo
  - expo-router
  # Released by this project's maintainers alongside the app, often the same day.
  - react-native-true-image

patchedDependencies:
  '@expo/metro-config@57.0.13': mobile/patches/@expo__metro-config@57.0.13.patch
  expo-router@57.0.21: mobile/patches/expo-router@57.0.21.patch
