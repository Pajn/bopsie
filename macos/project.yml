# The Xcode project, generated by XcodeGen: run `xcodegen` here. The generated Bopsie.xcodeproj is
# not committed; change this file instead.
name: Bopsie
options:
  bundleIdPrefix: io.github.pajn.bopsie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bopsie:
    type: application
    platform: macOS
    sources:
      - path: Bopsie
      # Made by scripts/build-rust.sh, as is the framework below.
      - path: Generated/Sources/bopsie_player_ffi.swift
        group: Generated
        optional: true
    dependencies:
      - framework: Generated/BopsiePlayerFFI.xcframework
        embed: false
      # What the Rust player links against: CoreAudio through cpal, the system certificate
      # store for TLS.
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AudioUnit.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    # Merged into the generated Info.plist. Artwork comes from the server, often over plain HTTP
    # on the local network, which App Transport Security otherwise refuses.
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: Build the Rust player
        script: '"$SRCROOT/scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pajn.bopsie.mac
        PRODUCT_NAME: Bopsie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bopsie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        # A menu bar app: no Dock icon, no main menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Bopsie plays from a Bopsie server on your network.
        # Signed by the team's certificates in the login Keychain: Apple Development for Debug,
        # Developer ID Application for Release, which scripts/release.sh notarizes. The team ID
        # is public, written into every app it signs; another team overrides it with
        # DEVELOPMENT_TEAM on the xcodebuild command line.
        DEVELOPMENT_TEAM: TH9Z48BPVV
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        # Required for notarization.
        ENABLE_HARDENED_RUNTIME: YES
        # The Rust build writes to Generated/, outside what a sandboxed script may touch.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # This Mac's architecture only, in Release too, until the Rust player is built for both.
        ONLY_ACTIVE_ARCH: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          # Notarization requires a secure timestamp on every signature.
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Xcode adds the debugger's get-task-allow entitlement to builds; notarization
          # rejects an app that carries it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
