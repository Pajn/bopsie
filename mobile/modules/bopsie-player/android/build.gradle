plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.bopsieplayer'
version = '1.0.0'
android {
  namespace 'expo.modules.bopsieplayer'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  def media3Version = '1.11.1'
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  // Also provides OkHttp, which the Sendspin socket uses.
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub on the JVM; tests need the real one.
  testImplementation 'org.json:json:20250517'
}
