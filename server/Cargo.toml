[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/audio",
    "crates/library",
    "crates/providers/filesystem",
    "crates/players",
    "crates/players/airplay",
    "crates/players/sendspin",
    "crates/queues",
    "crates/api",
    "crates/server",
    "crates/fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bopsie-core = { path = "crates/core" }
bopsie-audio = { path = "crates/audio" }
bopsie-library = { path = "crates/library" }
bopsie-providers-filesystem = { path = "crates/providers/filesystem" }
bopsie-players = { path = "crates/players" }
bopsie-players-airplay = { path = "crates/players/airplay" }
bopsie-players-sendspin = { path = "crates/players/sendspin" }
bopsie-queues = { path = "crates/queues" }
bopsie-api = { path = "crates/api" }
bopsie-fixtures = { path = "crates/fixtures" }

argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
lofty = "0.25"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
