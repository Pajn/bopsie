[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/audio",
    "crates/library",
    "crates/metadata",
    "crates/providers/filesystem",
    "crates/players",
    "crates/players/airplay",
    "crates/players/sendspin",
    "crates/players/linkplay",
    "crates/players/cast",
    "crates/queues",
    "crates/sources",
    "crates/sources/spotify",
    "crates/api",
    "crates/server",
    "crates/fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bopsie-core = { path = "crates/core" }
bopsie-audio = { path = "crates/audio" }
bopsie-library = { path = "crates/library" }
bopsie-metadata = { path = "crates/metadata" }
bopsie-providers-filesystem = { path = "crates/providers/filesystem" }
bopsie-players = { path = "crates/players" }
bopsie-players-airplay = { path = "crates/players/airplay" }
bopsie-players-sendspin = { path = "crates/players/sendspin" }
bopsie-players-linkplay = { path = "crates/players/linkplay" }
bopsie-players-cast = { path = "crates/players/cast" }
bopsie-queues = { path = "crates/queues" }
bopsie-sources = { path = "crates/sources" }
bopsie-sources-spotify = { path = "crates/sources/spotify" }
bopsie-api = { path = "crates/api" }
bopsie-fixtures = { path = "crates/fixtures" }

argon2 = "0.6"
audioadapter-buffers = "5.2"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
deunicode = "1.6"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8", default-features = false, features = ["with-libmdns", "rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
lofty = "0.25"
mime_guess = "2.0"
mdns-sd = "0.21"
nix = { version = "0.31", features = ["fs", "net", "signal"] }
rand = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rubato = "5.0"
rust-embed = { version = "8.13", features = ["interpolate-folder-path", "mime-guess"] }
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
symphonia = { version = "0.6", features = ["all"] }
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
