# Every key is optional; these are the defaults.

[server]
# Address and port for the API, /ws and /sendspin. 8095 is Music Assistant's port, so clients
# that assume it find this server.
bind = "0.0.0.0:8095"
# The name clients show for this server.
name = "Bopsie"
# The URL clients reach the server at, reported in server info. Unset, none is reported.
# base_url = "http://music.local:8095"

[storage]
# Where the database lives, relative to the working directory unless absolute.
data_dir = "data"

[library]
# Folders of music to scan, at startup and on request.
folders = []

[sendspin]
# Address and port for Sendspin clients that connect directly, without an API token. Clients
# that sign in to the API connect through its /sendspin instead.
bind = "0.0.0.0:8927"

[audio]
# The ffmpeg binary, used for AAC and ALAC in MP4 containers and for Opus. Unset, ffmpeg is
# used if it is on the path.
# ffmpeg = "/usr/bin/ffmpeg"

[airplay]
# The cliairplay binary, which scripts/fetch-cliairplay.sh downloads. Unset, cliairplay is used
# if it is on the path; without it there is no AirPlay.
# binary = "/usr/local/bin/cliairplay"
# One PTP clock shared by AirPlay 2 groups, so they play in sync. It needs UDP ports 319 and 320:
# root, or CAP_NET_BIND_SERVICE on Linux. Without it, each speaker keeps its own clock.
ptp = true

[airplay.passwords]
# Passwords for speakers that ask for one, by player id.
# apaabbcc001122 = "password"
