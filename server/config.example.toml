# Every key is optional; these are the defaults.

[server]
# Address and port for the API, /ws and /sendspin. 8095 is Music Assistant's port, so clients
# that assume it find this server.
bind = "0.0.0.0:8095"
# The name clients show for this server.
name = "Bopsie"
# The URL clients reach the server at, reported in server info. Unset, none is reported.
# base_url = "http://music.local:8095"

[storage]
# Where the database lives, relative to the working directory unless absolute.
data_dir = "data"

[library]
# Folders of music to scan, at startup and on request.
folders = []

[sendspin]
# Address and port for Sendspin clients that connect directly, without an API token. Clients
# that sign in to the API connect through its /sendspin instead.
bind = "0.0.0.0:8927"

[audio]
# The ffmpeg binary, used for AAC and ALAC in MP4 containers and for Opus. Unset, ffmpeg is
# used if it is on the path.
# ffmpeg = "/usr/bin/ffmpeg"

[airplay]
# The cliairplay binary, which scripts/fetch-cliairplay.sh downloads. Unset, cliairplay is used
# if it is on the path; without it there is no AirPlay.
# binary = "/usr/local/bin/cliairplay"
# One PTP clock shared by AirPlay 2 groups, so they play in sync. It needs UDP ports 319 and 320:
# root, or CAP_NET_BIND_SERVICE on Linux. Without it, each speaker keeps its own clock.
ptp = true

[linkplay]
# LinkPlay speakers on the network (WiiM, Audio Pro, Arylic and others) are found by mDNS,
# played by a stream they pull from the server, and grouped by their own multiroom.
enabled = true
# Devices that ask for a client certificate, as Audio Pro's do, are shown LinkPlay's, which the
# server carries (crates/players/linkplay/NOTICE). Another may be given as a PEM file holding
# the certificate and its key.
# certificate = "/etc/bopsie/linkplay-client.pem"

[planner]
# The protocols a group may play over, in order of preference. A group plays over one of them;
# a speaker that cannot play over the one chosen cannot join.
protocols = ["airplay", "sendspin"]

# Settings for one player, by its player id (players/all lists them). Every key is optional.
# A speaker reached over more than one protocol is one player whose endpoints have ids of their
# own (players/all with return_protocol_players lists them): name and enabled apply to the
# player's id, password and quirks to an endpoint's.
# [players.apaabbcc001122]
# name = "Kitchen"          # instead of the name the speaker gives itself
# enabled = false           # hide it and never play to it
# password = "password"     # for speakers that ask for one
#
# Quirks, over the rules shipped in crates/players/quirks.toml:
# [players.apaabbcc001122.quirks]
# max_sample_format = { sample_rate = 44100, bits = 16 }
# min_lead_ms = 3000        # start playback at least this far ahead
# sync_adjust_ms = 20       # play this much later (or earlier, if negative) than the group
# protocol = "airplay2"     # AirPlay route: auto, raop, airplay2 or airplay2-compat
# timing = "ntp"            # AirPlay timing: auto, ptp or ntp
# pairing = "transient"     # none, transient, pin or password, when detection is wrong
# disconnect_on_idle_s = 300
