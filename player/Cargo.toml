[workspace]
resolver = "3"
members = ["crates/client", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bopsie-player = { path = "crates/client" }

# Bopsie builds on a fork until its changes are upstream; see
# docs/plans/2026-10-18-shared-sendspin-client.md.
sendspin = { git = "https://github.com/Pajn/sendspin-rs", rev = "0ab0681326d2c7fd42149c6a09769b279fc0d0c9" }
# The version sendspin is built on, for TLS: the features unify with its own.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# TLS through rustls with ring, its one crypto provider, which rustls then installs itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
parking_lot = "0.12"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.28", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
