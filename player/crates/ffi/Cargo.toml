[package]
name = "bopsie-player-ffi"
description = "The UniFFI surface over bopsie-player that Swift and Kotlin apps see."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# staticlib for the apps to link, cdylib for uniffi-bindgen to read the interface from.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
bopsie-player.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
