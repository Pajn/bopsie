name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm check:icons
      - run: pnpm typecheck
      - run: pnpm test --ci

  mobile-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The server as it is in this commit, sharing its layers' cache with the server-image job.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: bopsie-server:ci
          cache-from: type=gha
      - run: pnpm server:start
        env:
          BOPSIE_IMAGE: bopsie-server:ci
      - run: eval "$(scripts/test-server.sh env)" && pnpm test:integration --ci
      - if: always()
        run: pnpm server:stop

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The server as it is in this commit, with this commit's web UI built in.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: bopsie-server:ci
          cache-from: type=gha
      - run: pnpm exec playwright install --with-deps chromium
      - run: mobile/scripts/test-server.sh start
        working-directory: .
        env:
          BOPSIE_IMAGE: bopsie-server:ci
      - run: eval "$(../mobile/scripts/test-server.sh env)" && pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: web/playwright-report
      - if: always()
        run: mobile/scripts/test-server.sh stop
        working-directory: .

  mobile-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec expo prebuild -p android --no-install
      - run: pnpm test:native

  client-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --ci

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --ci
      - run: pnpm export

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Dozens of test binaries with full debug info fill the runner's disk while linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          BOPSIE_REQUIRE_FFMPEG: '1'

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: bopsie-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name bopsie -p 8095:8095 bopsie-server:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8095/info && break; sleep 1; done
          curl -fsS localhost:8095/info
          curl -fsS -H 'Accept: text/html' localhost:8095/players | grep -q '<div id="root">'
          docker exec bopsie cliairplay --check
          docker exec bopsie ffmpeg -version
          docker exec bopsie fpcalc -version
          docker stop bopsie
          docker logs bopsie
      - name: Check the systemd unit
        run: |
          docker create --name extract bopsie-server:ci
          sudo docker cp extract:/usr/local/bin/bopsie-server /usr/local/bin/bopsie-server
          sudo useradd --system bopsie
          systemd-analyze verify server/packaging/bopsie.service
      - name: Name the image
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
